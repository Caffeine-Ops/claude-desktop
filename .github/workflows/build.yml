name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# （2026-07-29）CLI_SOURCE / PYTHON_STANDALONE_* 已随组件发布链路搬到
# .github/workflows/publish-components.yml —— CLI 二进制与 python-runtime 不再
# 随安装包发布，本 workflow 只负责打壳。版本钉的唯一事实源现在是那个 workflow
# 的 inputs 与服务器上的 components.json。运维流程见 docs/runtime-components-deploy.md。

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 平台/架构维度只剩「在哪台 runner 上打壳」——CLI 与 python 的
          # 资产名、版本钉已随组件发布搬到 publish-components.yml。
          #
          # Apple Silicon. macos-latest 是 arm64 runner，`bun install` 在这里
          # 编译/拉取的是 arm64 native addon（sharp、onnxruntime-node），与本次
          # 构建的架构一致。（better-sqlite3 已不在其列，daemon 改用 node:sqlite。）
          - os: macos-latest
            platform: mac
            arch: arm64
          # Intel Mac. **必须**跑在 Intel(x64) runner 上，否则 `bun install` 拉的是
          # arm64 native addon，装进 x64 包会在加载时崩。GitHub 的 Intel mac runner
          # 现在用 `-intel` 后缀（旧的 macos-13 Intel 镜像已退役，macos-14+ 默认
          # arm64）——macos-15-intel 是当前的 GA x64 镜像。
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pin Node to .nvmrc (24) so build-time tooling (tsc, esbuild prebundle)
      # runs on the same major the daemon runs under. (Pre-2026-07-15 this also
      # had to match the ABI the daemon's better-sqlite3 native addon was
      # compiled for; that native dependency is gone — SQLite is node:sqlite —
      # so there is no ABI to align and no native-addon verify step anymore.)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Write env.json from secret
        shell: bash
        env:
          ENV_JSON: ${{ secrets.ENV_JSON }}
        run: |
          if [ -z "$ENV_JSON" ]; then
            echo "::error::ENV_JSON secret is empty. Configure it in Settings → Secrets → Actions."
            exit 1
          fi
          # MUST write to apps/studio/env.json, NOT the repo root. Two reasons:
          #   1. electron-builder's `files: ["env.json"]` is relative to the
          #      package dir (apps/studio), so a repo-root env.json never gets
          #      packed into the asar → loadEnv finds nothing in prod → every
          #      env.json-backed feature (gpt-image-2 OPENAI_API_KEY, fusion-code
          #      ANTHROPIC_* gateway) silently degrades.
          #   2. loadEnv's packaged candidate is <asar>/env.json, fed by exactly
          #      this packed copy.
          # The monorepo move left this writing to the old repo-root location;
          # see [[2026-05-25-monorepo打包CI逐层路径未从根迁到appsdesktop]].
          printf '%s' "$ENV_JSON" > apps/studio/env.json
          python -c "import json; json.load(open('apps/studio/env.json'))" \
            || { echo "::error::env.json is not valid JSON"; exit 1; }

      # ── CLI 二进制与 python-runtime 的下载步骤已于 2026-07-29 退役 ──
      #
      # 它们不再随安装包发布，改由客户端首次启动时按需下载（见
      # apps/studio/electron/main/services/componentInstaller.ts）。搬走的理由：
      # 两者合计占安装包体积的绝大部分，且版本节奏与 app 完全不同——CLI 一个月
      # 变一次、app 一周发几次，随包意味着换个 CLI 版本就得重发一次 app。
      #
      # 组件的发布链路搬到了独立的 .github/workflows/publish-components.yml
      # （workflow_dispatch 手动触发），连同 CLI_SOURCE 的 fusion/official 二选一、
      # 官方 manifest 校验和比对、fusion 侧的字节数防截断闸门、python 的 3.12
      # 版本断言，全部原样搬了过去，一条都没丢。运维流程见
      # docs/runtime-components-deploy.md。

      # kb-model 下载暂时跳过（2026-07-06）：runner 上对 huggingface.co 的请求被
      # 一个会返回非法 URL 的 resolve-cache 层污染（node/bun 直跑皆同样报
      # ERR_INVALID_URL，问题在 CI 环境本身，非脚本 runtime 选择），导致
      # "Prepare kb-model" 必现失败、挡住整条发布链。KB 语义检索代码对模型缺失
      # 有正式设计的降级路径（kbSemanticSearch.ts 顶部注释：worker 收不到 ready
      # 会永久走 BM25 关键词检索，不崩溃），故先跳过让构建放行，后续查清 CI 环境
      # 的网络层问题后再恢复本步骤 + build:mac/win/linux 里的 prebundle:kb-model
      # && verify:kb-model 调用。

      # Only typecheck the package this workflow actually ships: the
      # Electron app. Its tsconfig project-references pull in every
      # @open-design/* package it depends on, so their types get checked
      # transitively. We deliberately do NOT run the repo-wide
      # `bun run typecheck` here: it fans out to ALL workspaces including
      # @open-design/daemon, whose own `typecheck` script shells out to
      # `pnpm` — and this runner only has bun (oven-sh/setup-bun), so
      # daemon's step dies with `pnpm: command not found` (exit 127).
      # The daemon is a standalone service, not part of the desktop
      # bundle, so it has no business gating the desktop build.
      - name: Type check
        run: bun run --filter='@claude-desktop/studio' typecheck

      # bun test 与 typecheck 并列做质量门：写方案 skill 化把方法论外置成
      # skills/proposal-writer 的模板文件，其正确性由快照（逐字节）与契约测试
      # 守护——CI 不跑 test 的话这道门只存在于开发者本机自觉，改坏模板的提交能
      # 一路发进 Release。Windows runner 上模板/快照的行尾一致性由仓库根
      # .gitattributes（skills/**、*.snap 钉 eol=lf）保证。
      - name: Unit tests
        run: bun run --filter='@claude-desktop/studio' test

      # scripts/ (the kb-sync manifest publisher, run manually on the server —
      # not part of the desktop app bundle) has its own bun:test suite. It
      # isn't under apps/studio so the filter above never touches it; without
      # this step a broken manifest.ts could ship straight to the release
      # workflow with zero CI signal.
      - name: Scripts tests
        run: bun test scripts/

      # Use `dist:<platform>`, NOT `build:<platform>`. The desktop
      # `build:*` chain assumes apps/daemon/dist/cli.js and apps/studio/out
      # already exist (its prebundle:daemon step only COPIES them) — true
      # locally where they linger from a previous build, but a clean CI
      # checkout has neither. `dist:*` runs `prebuild:resources` first to
      # build the daemon (tsc) and the studio static export (apps/web was
      # physically retired in Phase 4). The library packages daemon/studio
      # import from `dist/` are already built by the root postinstall (runs
      # during `bun install`), so we don't repeat them here.
      # mac 证书：把 base64 secret 解码成真实 .p12 文件，让 CSC_LINK 指向
      # **文件路径**而非 base64 字符串（2026-07-05 起，v0.0.18 踩坑后）。
      # 为什么不直接把 base64 塞给 CSC_LINK：electron-builder 25.x 的
      # codeSign/codesign.js 判「这是 base64 还是路径」靠三选一——有
      # `data:...;base64,` 前缀 / 长度>2048 / 以 `=` 结尾。GitHub secret 在
      # 存取/复制中一旦末尾被裁掉 `=` 且长度判定边缘，就三条全不中 → 被当
      # 成相对路径 → `<cwd>/apps/studio/<base64> doesn't exist`（v0.0.18 mac
      # job 连炸三轮实锤）。解成文件走 codesign.js 第一个分支（statOrNull
      # 文件存在检查），彻底绕开脆弱的 base64 嗅探。诊断输出（长度/大小/
      # openssl 能否识别）帮判 secret 到底是被截断还是密码错——值本身不打印。
      - name: Decode signing certificate (mac)
        if: matrix.platform == 'mac'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # 断言用：证书里带的 Team ID 必须与公证用的 APPLE_TEAM_ID 是同一个。
          # 两者分属不同 secret，换开发者组织时极易只换其一（2026-08-31 换到
          # Team LY4H54M9XG 时就是分两次写的），不比对就得等到 notarytool 报
          # 一句 403 才发现，那时构建已经跑了半小时。
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$MAC_CSC_LINK" ]; then
            echo "::warning::MAC_CSC_LINK 为空，跳过签名（mac 自动更新将不可用）"
            echo "CSC_FILE=" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "base64 长度: ${#MAC_CSC_LINK}"
          # 去掉可能混入的空白/换行再解码（tr -d '\n\r '），最稳。
          printf '%s' "$MAC_CSC_LINK" | tr -d '\n\r ' | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "解码后 .p12 大小: $(stat -f%z "$RUNNER_TEMP/cert.p12") bytes"
          # 密码校验：用 macOS 自带的 `security import` 试导入到一个**临时钥匙串**，
          # 成功即证明 base64 完整 + 密码正确。为什么不用 openssl：
          #   - runner 的 `openssl` 是 macOS 的 LibreSSL，不认 `-legacy` 参数
          #     （`Unrecognized flag legacy`，v0.0.18 第六轮实锤）；
          #   - 且 LibreSSL/OpenSSL 对 Apple 老算法 p12（RC2）支持不一，靠它判
          #     密码本就脆。
          # 而 electron-builder 真正签名走的**正是** `security import`，用它自检
          # = 用签名同一套工具预演，最贴真、零第三方差异。临时钥匙串用完即删，
          # 不污染 runner 的 login 钥匙串。
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PWD="ci-temp-$RANDOM"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          if security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" -T /usr/bin/codesign 2>&1; then
            echo "✓ 证书导入成功（base64 完整 + 密码正确）"
            echo "--- 钥匙串内的签名身份 ---"
            security find-identity -v -p codesigning "$KEYCHAIN"
            # ⚠️ 这里曾是 `... | grep -i "Developer ID" || true`——`|| true` 让它
            # 只会打印、永远不会失败，等于没有断言。换开发者组织恰恰是它该拦人的
            # 时刻：p12 里若装的是 Apple Distribution（App Store 用）而不是
            # Developer ID Application（自分发用），那条 grep 照样绿灯放行，一路
            # 走到 CSC_IDENTITY_AUTO_DISCOVERY=true 让 electron-builder 从钥匙串
            # 另行搜身份，最后产出未签名或签错的包——与 v0.0.18 第八轮「自检全绿
            # 却打印 skipped macOS application code signing」同一族的静默退化。
            # 2026-08-31 换 Team 时改成真断言，并在 verify-signing 分支上做过负向
            # 测试（只跑正向的断言等于没有断言）。
            if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
              echo "::error::钥匙串里没有 Developer ID Application 身份——p12 里装的证书类型不对"
              security delete-keychain "$KEYCHAIN" 2>/dev/null || true
              exit 1
            fi
            if [ -n "$EXPECTED_TEAM_ID" ] && ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "($EXPECTED_TEAM_ID)"; then
              echo "::error::证书的 Team ID 与 APPLE_TEAM_ID 不一致——两个 secret 来自不同开发者账号"
              security delete-keychain "$KEYCHAIN" 2>/dev/null || true
              exit 1
            fi
            echo "✓ 身份类型与 Team ID 均符合预期"
          else
            echo "::error::证书导入失败——base64 被截断，或 MAC_CSC_KEY_PASSWORD 与导出时设的密码不一致"
            security delete-keychain "$KEYCHAIN" 2>/dev/null || true
            exit 1
          fi
          # 自检用的临时钥匙串删掉——electron-builder 会自己再建它需要的钥匙串。
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          echo "CSC_FILE=$RUNNER_TEMP/cert.p12" >> "$GITHUB_ENV"

      # mac 签名 + 公证（自动更新的硬前提，2026-07-05 起）：
      #   - CSC_LINK 指向上一步解码出的 .p12 **文件路径**（win 拿空串跳过——
      #     CSC_LINK 是 electron-builder 跨平台通用签名 env，win 侧看到 mac
      #     证书会误当 Windows 代码签名证书解析，报 `WIN_CSC_LINK is not
      #     correct`，v0.0.18 win job 实锤；Windows 本就不签名，首装仅
      #     SmartScreen 警告，不挡自动更新）。
      #   - APPLE_* 只在 mac 注入：三者齐全时 electron-builder 自动走
      #     notarytool 公证（无需在 build 配置里声明 notarize；缺任一则跳过）。
      #   - CSC_IDENTITY_AUTO_DISCOVERY：**mac 必须 true**（默认），win 才 false。
      #     2026-07-05 血泪：曾对两平台都设 'false'，本意只想禁「从 runner 钥匙串
      #     瞎捞证书」，但在 electron-builder 25.x 它会**连带禁掉整个签名身份
      #     发现流程——包括从 CSC_LINK 导入**。结果 mac job 全绿却打印
      #     `skipped macOS application code signing … CSC_IDENTITY_AUTO_DISCOVERY
      #     =false`，出的是**未签名未公证**的包（v0.0.18 第八轮实锤：自检导入
      #     证书成功、真打包却跳过签名）。mac 设 true 让它正常走 CSC_LINK →
      #     导证书 → codesign → notarytool 公证；win 无证书，false 防它徒劳搜索。
      - name: Build (${{ matrix.platform }}-${{ matrix.arch }})
        env:
          # Pin electron-builder's mac arch to THIS matrix leg. build:mac
          # consumes this as EB_MAC_ARCH_NAME (bare arch name, e.g. "x64") to
          # build `--mac dmg:${EB_MAC_ARCH_NAME} zip:${EB_MAC_ARCH_NAME}`.
          #
          # 2026-07-10 incident: the OLD form passed a bare CLI flag
          # (EB_MAC_ARCH="--arm64"/"--x64", i.e. `electron-builder --mac
          # --arm64`). That does NOT limit the arch when a config target
          # entry already declares its own `arch` array — and package.json's
          # mac.target entries declare arch: ["arm64", "x64"] on BOTH the dmg
          # and zip targets. electron-builder's computeArchToTargetNamesMap
          # (app-builder-lib/out/targets/targetFactory.js) only honors the
          # CLI-side arch restriction when the CLI's per-arch target-name list
          # is non-empty; a bare `--arm64`/`--x64` flag (no target name
          # attached) leaves that list empty, so it falls through to iterating
          # every target's OWN declared arch list — i.e. the config's
          # ["arm64","x64"] wins over the CLI flag, and BOTH arches get built
          # on ONE runner. Confirmed from raw job logs (bypassing `gh run view
          # --log`'s job-log mixup — fetch via `gh api .../actions/jobs/<id>/
          # logs` for a trustworthy read): both the mac-arm64 and mac-x64 legs
          # independently produced all 4 files (arm64+x64 zip+dmg) instead of
          # 2. The two legs' independently-rebuilt "same-named" files aren't
          # byte-identical (codesign/notarize timestamps differ), so whichever
          # leg's file the publish job's merged manifest pointed at usually
          # didn't match whichever leg's file got downloaded — sha512
          # mismatch on every mac asset (caught by the SAME DAY's new
          # "Verify asset checksums against manifests" step, working as
          # intended — it did NOT let a bad build reach the release, unlike
          # the OLDER v0.0.26/27 concurrent-write incident this file's other
          # comments describe, which is a different bug entirely).
          #
          # Fix: use electron-builder's `target:arch` suffix syntax instead of
          # a bare arch flag. `--mac dmg:arm64 zip:arm64` makes the CLI's
          # per-arch target-name list non-empty (["dmg"]/["zip"]), which trips
          # computeArchToTargetNamesMap's early-return (`if targetNames.length
          # > 0: return raw as-is`) — the config's own arch arrays are never
          # consulted, so only the ONE arch named on the CLI is ever built.
          # One runner = one arch, now actually enforced.
          EB_MAC_ARCH_NAME: ${{ matrix.arch }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform == 'mac' && 'true' || 'false' }}
          CSC_LINK: ${{ matrix.platform == 'mac' && env.CSC_FILE || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # 提高文件描述符上限：mac 签名时 @electron/osx-sign **递归遍历**整个
        # .app 内容并 open 每个文件，而本包 prebundled/ 有 1.7 万文件（含
        # 1.3 万 svg 图标，经 extraResources 散放进 .app/Contents/Resources），
        # 并发句柄撞爆上限 → `EMFILE: too many open files`（v0.0.18 第九~十一轮
        # 实锤：证书/签名都对，纯栽在句柄数）。
        # 关键：**裸 `ulimit -n` 提不上去**——macOS 软上限受**硬上限**约束，
        # runner 默认硬上限也不高。必须先 `launchctl limit maxfiles` 提系统级
        # 硬上限，`ulimit` 的软上限才抬得起来（第九/十轮只做 ulimit 无效的真因）。
        # signIgnore 也试过无效：它只过滤「顶层 .app 要不要签」，拦不到 osx-sign
        # 递归内部对每个子文件的 open。
        # ⚠️ 两处平台适配：
        #   1) shell: bash——win runner 默认 PowerShell，不认 `if [ ]`/`ulimit`
        #      语法；显式 bash 让两平台走同一套（win 用自带 git-bash）。
        #   2) ulimit/launchctl 用 matrix.platform 条件只在 mac 跑：win 上
        #      `ulimit` 不存在，裸写报 `ulimit is not recognized` 把 win job
        #      带崩（v0.0.18 第十一轮 win regression 实锤——win 本来一直能过）。
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            sudo launchctl limit maxfiles 262144 524288 || true
            ulimit -n 262144 || ulimit -n unlimited || true
            echo "ulimit -n = $(ulimit -n)"
          fi
          bun run dist:${{ matrix.platform }}

      # 产物落盘后再验一次——前面每一步都只能证明「证书能用」，只有 .app 上
      # 实际落下的签名才能证明「这次构建真的签了、且签对了」。v0.0.18 第八轮的
      # 教训正是：证书自检全绿、真打包却因 CSC_IDENTITY_AUTO_DISCOVERY=false 被
      # 整个跳过，出的是未签名包而 job 全绿。那种静默退化只有在这里才拦得住。
      #
      # env.CSC_FILE 为空 = 上一步判定没配证书、有意跳过签名，此时不该断言。
      - name: Verify mac signature & notarization
        if: matrix.platform == 'mac' && env.CSC_FILE != ''
        shell: bash
        env:
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          set -euo pipefail
          APP=$(find apps/studio/dist -maxdepth 2 -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "::error::apps/studio/dist 下找不到 .app，无法校验签名"
            exit 1
          fi
          echo "校验目标: $APP"
          echo "--- 证书链 ---"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Timestamp" || true

          # 断言 1：真的签了。未签名的 .app 上 codesign -dv 直接非零退出。
          if ! codesign -dv "$APP" 2>/dev/null; then
            echo "::error::.app 未签名——签名步骤被静默跳过了"
            exit 1
          fi
          # 断言 2：签的是预期的 team。
          ACTUAL=$(codesign -dv --verbose=4 "$APP" 2>&1 | grep "^TeamIdentifier=" | cut -d= -f2)
          echo "实际 TeamIdentifier: $ACTUAL"
          if [ -n "$EXPECTED_TEAM_ID" ] && [ "$ACTUAL" != "$EXPECTED_TEAM_ID" ]; then
            echo "::error::.app 的 TeamIdentifier 与 APPLE_TEAM_ID 不符"
            exit 1
          fi
          # 断言 3：签名自身完整（codesign 说成功 ≠ 签出来的东西验得过）。
          codesign --verify --strict --verbose=2 "$APP"
          echo "✓ 签名有效且 Team 正确"

          # 断言 4：配了公证凭据就必须真公证成功。electron-builder 在公证后会把
          # ticket staple 进 .app，stapler validate 读的是这张票——它过了才代表
          # 用户双击能直接打开，而不是撞上「无法验证开发者」。缺 APPLE_ID 时
          # electron-builder 本就跳过公证，那就不该断言。
          if [ -n "$APPLE_ID" ]; then
            if ! xcrun stapler validate "$APP"; then
              echo "::error::公证票据缺失或无效——配了 APPLE_* 却没公证成功"
              exit 1
            fi
            echo "✓ 公证票据已 staple"
          else
            echo "::warning::APPLE_ID 未配置，本次为「签名但未公证」——用户首次打开需在系统设置里手动放行"
          fi

      # Stage installers as an Actions artifact instead of uploading straight
      # to the GitHub Release from here. Why the change (2026-07-10 incident):
      # the OLD comment here claimed "action-gh-release is idempotent per tag
      # — mac and win can publish in parallel" — that assumption was WRONG.
      # Three matrix legs (mac-arm64/mac-x64/win) each called action-gh-release
      # against the SAME release CONCURRENTLY; when an asset with that name
      # already exists the action deletes-then-reuploads it, and that
      # delete+upload pair is not atomic across processes. Two legs racing
      # that window on the SAME release produced byte-corrupted assets on
      # BOTH mac arches simultaneously — v0.0.26 and v0.0.27 both shipped
      # zips whose actual sha512 didn't match latest-mac.yml, so every
      # installed client's "检查更新" failed with `sha512 checksum mismatch`
      # (confirmed by re-downloading and re-hashing both arches' zips against
      # the published manifest — neither matched, sizes didn't match either,
      # ruling out a single-arch fluke). Root cause: concurrent writers to one
      # release, not a build or signing defect.
      #
      # Fix: build jobs now ONLY produce artifacts (this step) — zero release
      # writes happen here. A single non-matrix `publish` job (below, `needs:
      # build`) downloads all three artifacts and uploads them to the release
      # ONE AT A TIME, in one process — no concurrent writers, no race window.
      # This does cost the old "skip the artifact quota" optimization (dmg/exe
      # now transit through Actions storage again), but correctness beats
      # quota headroom; the retention is 1 day so it doesn't accumulate.
      - name: Stage installers artifact
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-staging
          # mac legs also emit latest-mac.yml (per-arch, NOT release-ready —
          # see the publish job's merge step); win emits latest.yml, which
          # IS release-ready as-is (only one win arch, no merge needed).
          shopt -s nullglob
          for f in apps/studio/dist/*.dmg apps/studio/dist/*.zip apps/studio/dist/*.exe apps/studio/dist/*.blockmap; do
            cp "$f" release-staging/
          done
          if [ "${{ matrix.platform }}" = "mac" ]; then
            cp apps/studio/dist/latest-mac.yml "release-staging/latest-mac-${{ matrix.arch }}.yml"
          else
            cp apps/studio/dist/latest.yml release-staging/
          fi
          ls -la release-staging

      - name: Upload installers artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-staging/*
          if-no-files-found: error
          retention-days: 1

  # Single serial publisher (2026-07-10, replaces the old parallel-upload +
  # merge-mac-latest split — see the "Stage installers artifact" step comment
  # in `build` for the incident this fixes). Downloads all three matrix legs'
  # artifacts, merges the two per-arch mac manifests into one latest-mac.yml,
  # then makes exactly ONE action-gh-release call carrying every file. One
  # process, one release, one asset-upload pass — no concurrent writers, so
  # the delete-then-reupload race that corrupted v0.0.26/v0.0.27's mac zips
  # structurally cannot happen here.
  publish:
    name: Publish release (serial)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download mac-arm64 installers
        uses: actions/download-artifact@v4
        with:
          name: installers-mac-arm64
          path: release-out

      - name: Download mac-x64 installers
        uses: actions/download-artifact@v4
        with:
          name: installers-mac-x64
          path: release-out

      - name: Download win installers
        uses: actions/download-artifact@v4
        with:
          name: installers-win-x64
          path: release-out

      # Merge the two per-arch mac manifests (latest-mac-arm64.yml /
      # latest-mac-x64.yml, staged by the build job under those names so they
      # don't collide with each other before this point) into ONE
      # latest-mac.yml whose `files:` lists BOTH zips — electron-updater then
      # matches the entry for the user's CPU. arm64's manifest is the base
      # (top-level version/releaseDate/path/sha512 are arch-agnostic fallback
      # pointers); x64's `files[]` entry is appended.
      - name: Merge mac manifests into one latest-mac.yml
        shell: bash
        run: |
          set -euo pipefail
          ls -la release-out
          python3 - <<'PY'
          import sys
          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, "-m", "pip", "install", "--quiet", "pyyaml"])
              import yaml

          base_path = "release-out/latest-mac-arm64.yml"
          other_path = "release-out/latest-mac-x64.yml"
          with open(base_path) as f:
              base = yaml.safe_load(f)
          with open(other_path) as f:
              other = yaml.safe_load(f)

          def entries(m):
              return m.get("files", []) or []
          seen = set()
          merged_files = []
          for e in entries(base) + entries(other):
              url = e.get("url")
              if url in seen:
                  continue
              seen.add(url)
              merged_files.append(e)
          if len(merged_files) < 2:
              print("::error::expected >=2 file entries (arm64+x64) after merge, got", len(merged_files))
              sys.exit(1)
          base["files"] = merged_files

          with open("release-out/latest-mac.yml", "w") as f:
              yaml.safe_dump(base, f, sort_keys=False, default_flow_style=False)
          print("=== merged latest-mac.yml ===")
          print(open("release-out/latest-mac.yml").read())
          print("urls:", [e.get("url") for e in merged_files])
          PY
          # Per-arch staging names are consumed by the merge above — remove
          # them so they don't get uploaded to the release as stray assets.
          rm -f release-out/latest-mac-arm64.yml release-out/latest-mac-x64.yml

      # Integrity self-check BEFORE publishing: recompute each zip/dmg's
      # sha512 and compare against what the manifests claim. This is exactly
      # the check electron-updater does client-side — running it here means a
      # corrupted asset (network flake during artifact download, etc.) fails
      # the CI job loud instead of shipping silently broken auto-update to
      # every installed client (which is how the 2026-07-10 incident was
      # only noticed after users hit "检查更新" and got sha512 mismatch).
      - name: Verify asset checksums against manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, sys, yaml

          def sha512_b64(path):
              h = hashlib.sha512()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return base64.b64encode(h.digest()).decode()

          failed = False
          for manifest in ("release-out/latest-mac.yml", "release-out/latest.yml"):
              with open(manifest) as f:
                  doc = yaml.safe_load(f)
              for entry in doc.get("files", []) or []:
                  url = entry["url"]
                  path = f"release-out/{url}"
                  expected = entry["sha512"]
                  actual = sha512_b64(path)
                  if actual != expected:
                      print(f"::error::{manifest}: {url} sha512 mismatch — expected {expected}, got {actual}")
                      failed = True
                  else:
                      print(f"OK {manifest}: {url}")
          if failed:
              sys.exit(1)
          PY

      # ONE action-gh-release call for everything — the whole point of this
      # job existing (see header comment). fail_on_unmatched_files: true
      # because every file here MUST exist (unlike the old per-leg upload
      # where a leg only ever saw its own platform's files).
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: Caffeine-Ops/claude-desktop-releases
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          files: release-out/*
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

      # 把发给 GitHub Release 的同一批产物（安装包 + 合并后的 latest-*.yml）
      # rsync 到自建更新服务器，作为客户端 appUpdater 的 generic 兜底源。用的
      # 就是上面那个 release-out/ 目录，两边逐字节一致——不会出现「GitHub 有
      # 新版但自建源还是旧版」的分叉（sha512 已在前面校过一次）。
      #
      # 连接参数全走 Secrets（仓库 Settings → Secrets and variables →
      # Actions），要配这几个：
      #   SELFHOST_SSH_HOST     VPS 主机名 / IP
      #   SELFHOST_SSH_USER     SSH 用户
      #   SELFHOST_SSH_KEY      SSH 私钥（对应公钥已加到 VPS 的 authorized_keys）
      #   SELFHOST_DEPLOY_PATH  目标目录，需被 Nginx 映射到客户端里的
      #                         SELF_HOSTED_UPDATE_URL，如 /var/www/updates
      #   SELFHOST_SSH_PORT     可选，默认 22
      # 没配 SELFHOST_SSH_HOST 时本 step 自跳过（下面 shell 判空），不阻断
      # GitHub 发布主链——所以「先只发 GitHub、自建源以后再接」也不会红。
      #
      # 放在 GitHub Release step 之后：GitHub 是主源，先确保它发成功；自建源
      # 同步失败（VPS 临时不可达等）不该拖垮已成功的 GitHub 发布。若要严格
      # 双源一致、任一失败即 fail，去掉 `|| exit 0` 那类容错即可（这里没加，
      # 判空跳过是唯一的软路径）。
      - name: Sync to self-hosted update server
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SELFHOST_SSH_HOST }}
          SSH_USER: ${{ secrets.SELFHOST_SSH_USER }}
          SSH_KEY: ${{ secrets.SELFHOST_SSH_KEY }}
          SSH_PORT: ${{ secrets.SELFHOST_SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.SELFHOST_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${SSH_HOST}" ]; then
            echo "SELFHOST_SSH_HOST 未配置，跳过自建更新服务器同步。"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          PORT="${SSH_PORT:-22}"
          # 不带 --delete：VPS 上累积保留历史版本安装包（可回滚，也不打断正
          # 在下载旧包的客户端）；latest-*.yml 每次覆盖成最新，generic
          # provider 只认它，历史包只是躺着。磁盘涨了自行清理。
          # accept-new：首次连接自动信任 host key 并记进 known_hosts，之后
          # 校验；比 StrictHostKeyChecking=no 稍安全，生产可改预置 known_hosts。
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -p ${PORT} -o StrictHostKeyChecking=accept-new" \
            release-out/ \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"
          rm -f ~/.ssh/deploy_key
          echo "已同步 release-out/ 到 ${SSH_HOST}:${DEPLOY_PATH}/"
